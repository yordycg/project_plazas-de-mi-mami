<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ----------- GOOGLE FONTS ----------- -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet" />

    <!-- ----------- CDN BOOTSTRAP ----------- -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- ----------- CDN TOASTER CSS ----------- -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />

    <!-- ----------- CSS ----------- -->
    <link rel="stylesheet" href="assets/css/general.css" />
    <link rel="stylesheet" href="assets/css/style.css" />

    <link rel="stylesheet" href="assets/css/queries.css" />

    <!-- ----------- TITLE ----------- -->
    <title>Plazas De Mi Mami</title>
  </head>
  <body>
    <!-- ----------- MAIN ----------- -->

    <div class="container--login">
      <main class="main--login--section">
        <div class="login shadow--1">
          <div class="login--img--box">
            <img
              class="login--img"
              src="assets/images/inventory_example.jpg"
              alt="caricatura de una tienda e inventario" />
          </div>
          <div class="login--form--box center--cols">
            <h1 class="title">Plazas de mi Mami</h1>
            <h2>Bienvenido</h2>

            <!-- ----------- FORMULARIO LOGIN  ----------- -->

            <form id="login-form" class="login--form" method="post" autocomplete="off">
              <fieldset>
                <div class="form--group">
                  <label for="username-login">Usuario</label>
                  <input
                    id="username-login"
                    name="usernameLogin"
                    type="text"
                    placeholder="admin1"
                    maxlength="10"
                    required />
                  <div class="form--validation">
                    <span id="username-login-error" class="error--message hidden"> </span>
                    <div class="error--icon none">
                      <i class="bi bi-exclamation-circle-fill"></i>
                    </div>
                    <div class="success--icon none">
                      <i class="bi bi-check-circle-fill"></i>
                    </div>
                  </div>
                </div>
                <div class="form--group">
                  <label for="password-login">Contraseña</label>
                  <div class="password--container">
                    <input
                      id="password-login"
                      name="passwordLogin"
                      type="password"
                      placeholder="********"
                      minlength="8"
                      pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)[A-Za-z\d]{8,}"
                      title="La contraseña debe tener al menos 8 caracteres, una letra mayúscula, una letra minúscula y un número."
                      required />
                    <div class="password--toggle">
                      <i id="eye-icon" class="bi bi-eye"></i>
                      <i id="eye-slash-icon" class="bi bi-eye-slash none"></i>
                    </div>
                  </div>
                  <div class="form--validation">
                    <span id="password-login-error" class="error--message hidden"> </span>
                    <div class="error--icon none">
                      <i class="bi bi-exclamation-circle-fill"></i>
                    </div>
                    <div class="success--icon none">
                      <i class="bi bi-check-circle-fill"></i>
                    </div>
                  </div>
                </div>
              </fieldset>
              <button
                class="btn btn--full btn--primary radius--sm margin--bottom--md"
                type="submit">
                Ingresar
              </button>
              <button id="btn-open-modal" class="btn btn--full btn--outline radius--sm">
                Cambiar contraseña
              </button>
            </form>
          </div>
        </div>
      </main>

      <!-- ----------- MODAL LOGIN ----------- -->

      <dialog id="modal-login" class="modal--login--section">
        <header>
          <button id="btn-close-modal" class="btn btn--icon btn--close">
            <i class="bi bi-x"></i>
          </button>
          <h2>Cambiar contraseña!</h2>
        </header>
        <form id="login-form-modal" class="login--form" method="dialog" autocomplete="off">
          <fieldset>
            <div class="form--group">
              <label for="username-login-modal" class="">Usuario</label>
              <input
                id="username-login-modal"
                class="form--input radius--sm"
                name="username"
                type="text"
                placeholder="admin1"
                maxlength="10"
                required />
              <div class="form--validation">
                <span id="username-login-error" class="error--message hidden"> </span>
                <div class="error--icon none">
                  <i class="bi bi-exclamation-circle-fill"></i>
                </div>
                <div class="success--icon none">
                  <i class="bi bi-check-circle-fill"></i>
                </div>
              </div>
            </div>
            <div class="form--group">
              <label for="password-login-modal" class="">Nueva Contraseña</label>
              <!-- TODO: en el modal no me funciona el toggle de contraseña -->
              <div class="password--container">
                <input
                  id="password-login-modal"
                  class="form--input radius--sm"
                  name="passwordModal"
                  type="password"
                  placeholder="********"
                  minlength="8"
                  pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)[A-Za-z\d]{8,}"
                  title="La NUEVA contraseña debe tener al menos 8 caracteres, una letra mayúscula, una letra minúscula y un número."
                  required />
                <div class="password--toggle">
                  <i id="eye-icon" class="bi bi-eye"></i>
                  <i id="eye-slash-icon" class="bi bi-eye-slash none"></i>
                </div>
              </div>
              <div class="form--validation">
                <span id="password-login-error" class="error--message hidden"> </span>
                <div class="error--icon none">
                  <i class="bi bi-exclamation-circle-fill"></i>
                </div>
                <div class="success--icon none">
                  <i class="bi bi-check-circle-fill"></i>
                </div>
              </div>
            </div>
            <div class="form--group">
              <label for="password-confirm-login-modal" class="">Confirmar Contraseña </label>
              <div class="password--container">
                <input
                  id="password-confirm-login-modal"
                  class="form--input radius--sm"
                  name="passwordModalConfirm"
                  type="password"
                  placeholder="********"
                  minlength="8"
                  pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)[A-Za-z\d]{8,}"
                  title="La NUEVA contraseña debe tener al menos 8 caracteres, una letra mayúscula, una letra minúscula y un número."
                  required
                  match="password-login-modal" />
                <!-- match es una validación que hace referencia al input de la contraseña -->

                <div class="password--toggle">
                  <i id="eye-icon" class="bi bi-eye"></i>
                  <i id="eye-slash-icon" class="bi bi-eye-slash none"></i>
                </div>
              </div>
              <div class="form--validation">
                <span id="password-login-error" class="error--message hidden"> </span>
                <div class="error--icon none">
                  <i class="bi bi-exclamation-circle-fill"></i>
                </div>
                <div class="success--icon none">
                  <i class="bi bi-check-circle-fill"></i>
                </div>
              </div>
            </div>
          </fieldset>
          <button class="btn btn--full btn--primary radius--sm margin--bottom--md" type="submit">
            Cambiar
          </button>
          <button class="btn btn--full btn--outline radius--sm" type="reset">Limpiar</button>
        </form>
      </dialog>

      <!-- ----------- FOOTER ----------- -->

      <footer class="footer--login--section">
        <p>&copy; 2024 Plazas De Mi Mami</p>
      </footer>
    </div>

    <!-- ----------- CDN JQUERY ----------- -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- ----------- CDN TOASTER JS ----------- -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <!-- ----------- JS ----------- -->
    <script src="assets/js/main.js" type="module"></script>
  </body>
</html>
